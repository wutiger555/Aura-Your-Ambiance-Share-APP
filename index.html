<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura - Feel Your Atmosphere</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      }
      .text-shadow {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }

      @keyframes shimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-shimmer {
        background-size: 200% 200%;
        animation: shimmer 15s ease infinite;
      }
      
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow { animation: spin-slow 30s linear infinite; }

      @keyframes spin-very-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-very-slow { animation: spin-very-slow 60s linear infinite; }
      
      @keyframes bobble {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8%); }
      }
      .animate-bobble { animation: bobble 8s ease-in-out infinite; }

      @keyframes pulse-strong {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .animate-pulse-strong { animation: pulse-strong 2.5s ease-in-out infinite; }
      
      /* Starry background */
      @keyframes move-stars {
        from { background-position: 0 0; }
        to { background-position: -10000px 5000px; }
      }
      .starry-sky {
        background-color: #1e293b; /* slate-800 */
        background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="10" cy="10" r="0.5" fill="white"/><circle cx="30" cy="70" r="0.7" fill="white"/><circle cx="80" cy="40" r="0.6" fill="white"/></svg>'),
                          url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><circle cx="150" cy="50" r="0.8" fill="white"/><circle cx="40" cy="150" r="1" fill="white"/></svg>');
        animation: move-stars 200s linear infinite;
        transition: background-color 2s ease-in-out;
      }
      .starry-sky.connected {
        background-color: #312e81; /* indigo-900 for a deeper space feel */
      }


      /* Living Background - Sun/Moon Path */
      .celestial-path {
        position: absolute;
        left: 50%;
        width: 150%;
        padding-bottom: 75%;
        pointer-events: none;
      }
      .celestial-path.bottom {
        top: 50%;
        transform: translate(-50%, -80%) rotate(180deg);
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      }
      .celestial-path.top {
        bottom: 50%;
        transform: translate(-50%, 80%) rotate(0deg);
        border-radius: 0 0 50% 50% / 0 0 100% 100%;
      }
      .celestial-body {
        position: absolute;
        left: 50%;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 60%);
        transform-origin: center calc(150vw / 2);
        transform: translateX(-50%) rotate(var(--celestial-rotation, 0deg));
        transition: transform 1s ease-out, background 1s ease-out;
      }
      .celestial-path.bottom .celestial-body {
        top: 0;
      }
       .celestial-path.top .celestial-body {
        bottom: 0;
      }

       /* Drifting particles */
      .particles {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: drift 20s infinite linear;
      }
      @keyframes drift {
        from {
          transform: translate(var(--x-start), var(--y-start));
          opacity: 0;
        }
        25% { opacity: var(--opacity-max); }
        75% { opacity: var(--opacity-max); }
        to {
          transform: translate(var(--x-end), var(--y-end));
          opacity: 0;
        }
      }
      
      /* New Logo Setup Screen Styles */
       @keyframes pulse-sun {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #fefce8); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 8px #fefce8); }
      }
      .animate-pulse-sun {
        animation: pulse-sun 2.5s ease-in-out forwards;
      }
      
      @keyframes draw-ring {
        from { stroke-dashoffset: 302; }
        to { stroke-dashoffset: 0; }
      }
      .animate-draw-ring {
        stroke-dasharray: 302;
        animation: draw-ring 1.5s ease-out forwards;
      }
      
      /* New Marker Connection Animation Styles */
      .marker {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        z-index: 10;
        opacity: 0;
        will-change: opacity, transform;
      }
      
      @keyframes marker-appear {
          0% { transform: scale(0.5); opacity: 0; }
          70% { transform: scale(1.2); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
      }

      .marker.visible {
        opacity: 1; /* Fallback for browsers without animation support */
        animation: marker-appear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .marker-my {
        background-color: #67e8f9; /* cyan-300 */
        box-shadow: 0 0 15px 5px #67e8f9;
        bottom: 20%;
        left: 20%;
      }

      .marker-partner {
        background-color: #f9a8d4; /* pink-300 */
        box-shadow: 0 0 15px 5px #f9a8d4;
        top: 20%;
        right: 20%;
      }

      .connecting .marker {
        opacity: 0 !important;
        transition-delay: 0s;
        transition-duration: 0.3s;
        animation: none;
      }

      .connection-flash {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) scale(0);
          width: 200px;
          height: 200px;
          background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(203, 213, 225, 0) 70%);
          border-radius: 50%;
          opacity: 0;
          z-index: 20;
      }
      .connecting .connection-flash {
          animation: flash-and-fade 1.5s cubic-bezier(0.165, 0.84, 0.44, 1) 1.5s forwards;
      }

      @keyframes flash-and-fade {
          0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
          50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
          100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
      }

      .animate-stream {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw-stream 1.5s cubic-bezier(0.5, 0, 0.5, 1) forwards;
      }

      @keyframes draw-stream {
        to {
          stroke-dashoffset: 0;
        }
      }
      
      /* New Main Screen Styles */
      .blended-sky {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .sky-half {
        position: absolute;
        left: 0;
        width: 100%;
        height: 55%; /* Overlap for smooth blend */
        transition: background 2s ease-in-out;
      }
      .sky-half.top {
        top: 0;
        --mask-gradient: linear-gradient(to bottom, black 70%, transparent 100%);
        -webkit-mask-image: var(--mask-gradient);
        mask-image: var(--mask-gradient);
      }
      .sky-half.bottom {
        bottom: 0;
        --mask-gradient: linear-gradient(to top, black 70%, transparent 100%);
        -webkit-mask-image: var(--mask-gradient);
        mask-image: var(--mask-gradient);
      }

      .heartline-button {
        background: rgba(10, 10, 20, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease-in-out;
      }
      .heartline-button:hover {
        background: rgba(10, 10, 20, 0.5);
        border-color: rgba(255, 255, 255, 0.25);
        transform: scale(1.05);
      }
      
      .timeline-container {
        position: relative;
        width: 100%;
        height: 20px;
      }
      .timeline-bar {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        overflow: hidden;
        background-color: rgba(255, 255, 255, 0.1);
        position: relative;
      }
      .timeline-night {
        position: absolute;
        top: 0;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.3);
      }
      .timeline-marker {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 0 8px rgba(0,0,0,0.5);
      }

      @keyframes flow {
        to { stroke-dashoffset: -1000; }
      }
      .animate-flow {
        stroke-dasharray: 7, 3;
        stroke-dashoffset: 0;
        animation: flow 60s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

    </style>

</html>
